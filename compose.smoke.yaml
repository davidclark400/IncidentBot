services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: panko_smoke
      POSTGRES_USER: panko
      POSTGRES_PASSWORD: panko-smoke-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panko -d panko_smoke"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Panko: Host=postgres;Port=5432;Database=panko_smoke;Username=panko;Password=panko-smoke-only
      Panko__RecipesPath: /app/config/smoke-recipe.yaml
      Panko__RequireSlackForReadiness: "false"
      PagerDuty__RequireSignature: "true"
      PAGERDUTY_WEBHOOK_SECRET: local-smoke-secret
      PAGERDUTY_API_TOKEN: local-smoke-token
      JwtIdentity__Required: "true"
      JwtIdentity__Authority: https://identity.smoke.internal
      JwtIdentity__Issuer: https://identity.smoke.internal
      TrustedProxies__KnownProxies__0: 127.0.0.1
      Slack__Enabled: "false"
      LITELLM_API_KEY: local-smoke-key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./tests/fixtures/smoke-recipe.yaml:/app/config/smoke-recipe.yaml:ro
      - ./tests/fixtures/smoke-appsettings.Production.json:/app/appsettings.Production.json:ro
