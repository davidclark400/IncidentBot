version: 2
revision: "2026-07-13.1"
fallbackSlackChannel: "#incident-response"

profiles:
  - id: payments-production
    pagerDutyServiceId: P123PAYMENTS
    team: payments
    slackChannel: "#payments-incidents"
    pagerDuty: {}

    nomad:
      region: global
      namespaces:
        - name: payments-production
          jobs:
            - payments-api
            - payments-worker

    gitLab:
      projects:
        - id: platform/payments
          branch: main
          environments:
            - production
          relevantPaths:
            - src/Payments.Api
            - deploy/nomad

    grafana:
      organizationId: 1
      annotationTags:
        - payments
        - production
      dashboards:
        - uid: payments-overview
          panelIds: [2, 7, 12]
      queries:
        - name: HTTP 5xx rate
          datasourceUid: prometheus-production
          expression: 'sum(rate(http_requests_total{service="payments-api",environment="{{environment}}",status=~"5.."}[5m]))'
          warningAbove: 1
        - name: p99 latency
          datasourceUid: prometheus-production
          expression: 'histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="payments-api",environment="{{environment}}"}[5m])))'
          warningAbove: 1.5

    victoriaLogs:
      accountId: "1"
      projectId: "20"
      streamFilters:
        namespace: payments-production
        service: payments-api
      fields: [_time, level, service, allocation_id, _msg]
      queries:
        - name: Errors
          expression: 'level:in(error, fatal) service:="payments-api"'
        - name: Panics and timeouts
          expression: 'service:="payments-api" (panic OR timeout)'
      redactPatterns:
        - '(?i)(authorization|token|password)[=: ]+[^ ,}]+'
