version: 1

# This checked-in pack is deliberately synthetic. It is a fixture and schema example,
# not a claim about any production exporter's metric names. Onboarding must add a
# reviewed pack derived from the target environment's real exporter catalog.
packs:
  - id: synthetic-fixture-kafka-v1
    title: Synthetic Kafka fixture metrics (not for production)
    metrics:
      - id: topic-message-rate
        title: Topic message rate
        category: kafka-topic-message-rate
        promQl: 'sum(rate(panko_fixture_kafka_topic_messages_total{cluster=~"{{clusterRegex}}",topic=~"{{topicRegex}}"}[5m]))'
        datasourceUid: synthetic-prometheus
        resourceScope: topic
        unit: messages/s
        timeReducer: average
        crumbMode: context
        requirement: required
        warningThreshold: 1000000
        criticalThreshold: 2000000
        direction: above
        dashboardRow: Overview
      - id: topic-byte-rate
        title: Topic byte rate
        category: kafka-topic-byte-rate
        promQl: 'sum(rate(panko_fixture_kafka_topic_bytes_total{cluster=~"{{clusterRegex}}",topic=~"{{topicRegex}}"}[5m]))'
        datasourceUid: synthetic-prometheus
        resourceScope: topic
        unit: bytes/s
        timeReducer: average
        crumbMode: context
        requirement: required
        warningThreshold: 1000000000
        criticalThreshold: 2000000000
        direction: above
        dashboardRow: Overview
      - id: broker-availability
        title: Available brokers
        category: kafka-broker-availability
        promQl: 'sum(panko_fixture_kafka_broker_up{cluster=~"{{clusterRegex}}"})'
        datasourceUid: synthetic-prometheus
        resourceScope: cluster
        unit: brokers
        timeReducer: minimum
        crumbMode: anomaly
        requirement: required
        warningThreshold: 2
        criticalThreshold: 1
        direction: below
        dashboardRow: Availability
      - id: offline-partitions
        title: Offline partitions
