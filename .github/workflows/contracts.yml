name: Contract synchronization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/IncidentBot.Client/package-lock.json

      - name: Install TypeScript generator
        run: npm ci
        working-directory: src/IncidentBot.Client

      - name: Generate OpenAPI and TypeScript contracts
        run: dotnet build src/IncidentBot.Api/IncidentBot.Api.csproj -p:BuildClient=false

      - name: Verify generated contracts are committed
        run: |
          npm run contracts:check --prefix src/IncidentBot.Client
          git diff --exit-code -- src/IncidentBot.Client/openapi src/IncidentBot.Client/src/api-client
