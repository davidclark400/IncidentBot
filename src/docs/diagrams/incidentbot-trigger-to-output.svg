<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1060" viewBox="0 0 1880 1060" role="img" style="max-width: 100%; height: auto;">
  <title>IncidentBot flow diagram</title>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <polyline points="260,247.5 300,247.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="570,247.5 610,247.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="880,247.5 920,247.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1220,247.5 1260,247.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1530,247.5 1570,247.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1705,320 1705,365 200,365 200,430" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="340,510 380,510" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="660,510 700,510" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1020,510 1060,510" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1380,510 1420,510" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1600,590 1600,655 220,655 220,725" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="380,807.5 420,807.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="740,807.5 780,807.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="1140,807.5 1200,807.5" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<polyline points="960,890 960,930 1660,930 1660,890" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g>
  <rect x="40" y="30" width="1800" height="90" rx="14" fill="#172554" stroke="#172554" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="940" y="85.2">IncidentBot: PagerDuty trigger to live report</tspan></text>
</g>
<g>
  <rect x="40" y="175" width="220" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="150" y="241.8">1. PagerDuty</tspan><tspan x="150" y="266.8">incident event</tspan></text>
</g>
<g>
  <rect x="300" y="175" width="270" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="435" y="231.12">2. Webhook gate</tspan><tspan x="435" y="253.62">≤256 KiB payload</tspan><tspan x="435" y="276.12">HMAC-SHA256 signature</tspan></text>
</g>
<g>
  <rect x="610" y="175" width="270" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="745" y="231.12">3. Parse + profile</tspan><tspan x="745" y="253.62">service + labels select scope</tspan><tspan x="745" y="276.12">filter persisted labels</tspan></text>
</g>
<g>
  <rect x="920" y="175" width="300" height="145" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1070" y="231.12">4. PostgreSQL transaction</tspan><tspan x="1070" y="253.62">dedupe webhook event ID</tspan><tspan x="1070" y="276.12">upsert incident state</tspan></text>
</g>
<g>
  <rect x="1260" y="175" width="270" height="145" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1395" y="231.12">5. Durable schedule</tspan><tspan x="1395" y="253.62">trigger/reopen: now, +30s, +90s</tspan><tspan x="1395" y="276.12">other events: now</tspan></text>
</g>
<g>
  <rect x="1570" y="175" width="270" height="145" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1705" y="231.12">6. Investigation worker</tspan><tspan x="1705" y="253.62">lease work item</tspan><tspan x="1705" y="276.12">per-incident run guard</tspan></text>
</g>
<g>
  <rect x="60" y="430" width="280" height="160" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="200" y="482.37">7. Load incident</tspan><tspan x="200" y="504.87">resolve current profile</tspan><tspan x="200" y="527.37">save provisional fingerprint</tspan><tspan x="200" y="549.87">find possible recurrence</tspan></text>
</g>
<g>
  <rect x="380" y="430" width="280" height="160" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="520" y="482.37">8. Initial report</tspan><tspan x="520" y="504.87">status: collecting</tspan><tspan x="520" y="527.37">sources: pending</tspan><tspan x="520" y="549.87">SignalR + Slack outbox</tspan></text>
</g>
<g>
  <rect x="700" y="430" width="320" height="160" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="860" y="482.37">9. Parallel collection</tspan><tspan x="860" y="504.87">PagerDuty • Nomad • GitLab</tspan><tspan x="860" y="527.37">Grafana • VictoriaLogs</tspan><tspan x="860" y="549.87">source failures stay isolated</tspan></text>
</g>
<g>
  <rect x="1060" y="430" width="320" height="160" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1220" y="482.37">10. Prepare AI input</tspan><tspan x="1220" y="504.87">dedupe + relevance ranking</tspan><tspan x="1220" y="527.37">source-diverse ordering</tspan><tspan x="1220" y="549.87">24k-character bounded digest</tspan></text>
</g>
<g>
  <rect x="1420" y="430" width="360" height="160" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1600" y="482.37">11. LiteLLM synthesis</tspan><tspan x="1600" y="504.87">strict JSON schema + exact citations</tspan><tspan x="1600" y="527.37">timeout or invalid output →</tspan><tspan x="1600" y="549.87">deterministic report continues</tspan></text>
</g>
<g>
  <rect x="60" y="725" width="320" height="165" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="220" y="779.87">12. Final recurrence</tspan><tspan x="220" y="802.37">deterministic evidence fingerprint</tspan><tspan x="220" y="824.87">match or create problem group</tspan><tspan x="220" y="847.37">AI output is never identity input</tspan></text>
</g>
<g>
  <rect x="420" y="725" width="320" height="165" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="580" y="779.87">13. Compose report</tspan><tspan x="580" y="802.37">evidence + timeline + sources</tspan><tspan x="580" y="824.87">causal candidate sequence</tspan><tspan x="580" y="847.37">AI or explicit unavailable state</tspan></text>
</g>
<g>
  <rect x="780" y="725" width="360" height="165" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="960" y="779.87">14. Atomic report save</tspan><tspan x="960" y="802.37">optimistic version check</tspan><tspan x="960" y="824.87">report JSON + evidence + timeline</tspan><tspan x="960" y="847.37">insert slack.report outbox item</tspan></text>
</g>
<g>
  <rect x="1200" y="725" width="270" height="165" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1335" y="779.87">15. Web output</tspan><tspan x="1335" y="802.37">SignalR version notification</tspan><tspan x="1335" y="824.87">client refetches report</tspan><tspan x="1335" y="847.37">5s polling fallback</tspan></text>
</g>
<g>
  <rect x="1510" y="725" width="300" height="165" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="1660" y="779.87">16. Slack output</tspan><tspan x="1660" y="802.37">outbox worker loads latest report</tspan><tspan x="1660" y="824.87">post once, then update by ts</tspan><tspan x="1660" y="847.37">retry with backoff</tspan></text>
</g>
<g>
  <rect x="190" y="955" width="1500" height="70" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#172554" text-anchor="middle"><tspan x="940" y="996.46">Durability rule: connector, recurrence, AI, and Slack failures degrade or retry independently; a committed deterministic report remains responder-visible.</tspan></text>
</g>
</svg>
