services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PANKO_POSTGRES_DB:-panko}
      POSTGRES_USER: ${PANKO_POSTGRES_USER:-panko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PANKO_POSTGRES_USER:-panko} -d ${PANKO_POSTGRES_DB:-panko}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - panko-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
    env_file:
      - ${PANKO_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Panko: Host=postgres;Port=5432;Database=${PANKO_POSTGRES_DB:-panko};Username=${PANKO_POSTGRES_USER:-panko};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Panko__RequireSlackForReadiness: "true"
      PagerDuty__RequireSignature: "true"
      JwtIdentity__Required: "true"
      Slack__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  panko-postgres:
    name: ${PANKO_POSTGRES_VOLUME:-panko_postgres}
