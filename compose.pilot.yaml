services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentbot
      POSTGRES_USER: incidentbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentbot -d incidentbot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - incidentbot-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
    env_file:
      - ${INCIDENTBOT_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IncidentBot: Host=postgres;Port=5432;Database=incidentbot;Username=incidentbot;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  incidentbot-postgres:
